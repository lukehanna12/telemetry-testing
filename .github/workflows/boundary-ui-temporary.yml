name: Temporary Boundary UI smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser protocol UI validation
        run: |
          node --input-type=module <<'NODE'
          
          import assert from "node:assert/strict";
          import {chromium} from "playwright";
          const host="https://chatgpt-mcp-boundary-lab.colosseum.workers.dev";
          const modes=["static","dcr","cimd"];
          const browser=await chromium.launch({headless:true});
          let cases=0;
          const check=(condition,message)=>{assert.ok(condition,message);cases++;console.log("PASS "+message)};
          for(const mode of modes){
           const path="/lab/"+mode+"/mcp";
           const resource="ui://boundary-lab/"+mode+"/auth-profile-v1.html";
           const r=await fetch(host+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:2,method:"resources/read",params:{uri:resource}})});
           check(r.status===200,mode+" resource response HTTP 200");
           const data=await r.json();
           const html=data.result?.contents?.[0]?.text;
           check(typeof html==="string"&&html.includes("Boundary Lab")&&html.includes("33 PROBES"),mode+" current dashboard HTML delivered");
           check(html.includes("data-theme")&&html.includes("function applyTheme"),mode+" theme-aware widget script delivered");
           const context=await browser.newContext({viewport:{width:920,height:900},colorScheme:"dark",reducedMotion:"reduce"});
           const page=await context.newPage();
           const errors=[];
           page.on("pageerror",e=>errors.push(e.message));
           await page.addInitScript(()=>{
             window.__posted=[];
             const original=window.postMessage;
             window.postMessage=function(message,...rest){window.__posted.push(message);return original.call(this,message,...rest)};
             const stub={theme:"dark"};
             const methods=["callTool","sendFollowUpMessage","requestModal","requestClose","openExternal","setOpenInAppUrl","setWidgetState","requestDisplayMode","notifyIntrinsicHeight","uploadFile","getFileDownloadUrl","selectFiles","getFileMetadata","notifyIntrinsicWidth","share","requestTargetedReply","requestCheckout","requestLinkToConnector","requestConnectSheet"];
             for(const m of methods)stub[m]=async()=>({ok:true});
             window.openai=stub;
           });
           await page.route("https://boundary-widget.local/",route=>route.fulfill({status:200,contentType:"text/html",body:html}));
           await page.route(host+"/**",route=>route.fulfill({status:200,contentType:"application/json",headers:{"access-control-allow-origin":"*"},body:'{"ok":true}'}));
           await page.goto("https://boundary-widget.local/",{waitUntil:"domcontentloaded"});
           const buttons=page.locator("button[data-a]");
           check(await buttons.count()===33,mode+" all 33 interactive probes retained");
           const ids=await buttons.evaluateAll(nodes=>nodes.map(x=>x.dataset.a));
           check(new Set(ids).size===33,mode+" probe IDs unique");
           check((await page.evaluate(()=>window.__posted)).some(x=>x.method==="ui/initialize"),mode+" MCP Apps initialize sent");
           await page.evaluate(()=>window.postMessage({jsonrpc:"2.0",id:1,result:{protocolVersion:"2025-11-21",hostContext:{theme:"dark",locale:"en-US"}}},"*"));
           await page.waitForFunction(()=>document.documentElement.dataset.theme==="dark"&&document.getElementById("status").textContent==="Initialized",{timeout:3000});
           check(await page.locator("#connection-name").innerText()===mode.toUpperCase(),mode+" mode label matches route");
           check(await page.locator("#theme-name").innerText()==="DARK",mode+" host dark mode applied");
           const dark=await page.locator("body").evaluate(node=>getComputedStyle(node).backgroundColor);
           await page.locator("button[data-a=std-tool] .probe-name").click();
           check((await page.evaluate(()=>window.__posted)).some(x=>x.method==="tools/call"),mode+" nested button label executes correct action");
           await page.locator("#clear-log").click();
           check(await page.locator("#event-count").innerText()==="0 events",mode+" activity console clear works");
           await page.locator("details.suite").nth(1).locator("summary").click();
           await page.locator("details.suite").nth(2).locator("summary").click();
           for(const id of ids){
             await page.locator('button[data-a="'+id+'"] .probe-name').click({timeout:5000});
           }
           check((await page.locator("#event-count").innerText())!=="0 events",mode+" all probe buttons dispatch without disrupting console");
           check(errors.length===0,mode+" no browser JavaScript exceptions: "+errors.slice(0,2).join("; "));
           await page.screenshot({path:"/tmp/"+mode+"-dark.png",fullPage:true});
           await page.evaluate(()=>window.postMessage({jsonrpc:"2.0",method:"ui/notifications/host-context-changed",params:{theme:"light"}},"*"));
           await page.waitForFunction(()=>document.documentElement.dataset.theme==="light");
           const light=await page.locator("body").evaluate(node=>getComputedStyle(node).backgroundColor);
           check(dark!==light,mode+" background actually changes between light and dark mode");
           await page.screenshot({path:"/tmp/"+mode+"-light.png",fullPage:true});
           await page.setViewportSize({width:365,height:830});
           const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
           check(!overflow,mode+" no horizontal overflow on narrow mobile viewport");
           await page.screenshot({path:"/tmp/"+mode+"-mobile.png",fullPage:true});
           await context.close();
          }
          await browser.close();
          console.log("UI_VALIDATION_SUMMARY "+JSON.stringify({passed:cases,failed:0,modes}));
          
          NODE
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-ui-screenshots
          path: /tmp/*-dark.png
          if-no-files-found: warn
