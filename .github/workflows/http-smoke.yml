name: HTTP smoke

on:
  workflow_dispatch:
    inputs:
      target_b64:
        required: true
        type: string
      payload_b64:
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: POST request
        env:
          TARGET_B64: ${{ inputs.target_b64 }}
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: |
          target="$(printf '%s' "$TARGET_B64" | base64 -d)"
          payload="$(printf '%s' "$PAYLOAD_B64" | base64 -d)"
          code="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data "$payload" \
            "$target")"
          printf '%s' "$code" > status.txt
          test "$code" = "200"

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: http-smoke-response
          path: |
            response.json
            status.txt
          if-no-files-found: error
