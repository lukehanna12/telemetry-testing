name: Build validation

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Optional snapshot identifier for deduplication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quintus-build-${{ github.ref }}-${{ inputs.snapshot || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Record proof
        run: |
          node --version > dist/build-proof.txt
          npm --version >> dist/build-proof.txt
          npm ls react react-dom vite @vitejs/plugin-react --depth=0 >> dist/build-proof.txt

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
