name: Temporary resource budget verification
on:
  push:
    paths: ['.github/workflows/resource-budget-smoke-temporary.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fail closed budget control
        run: |
          node --input-type=module <<'NODE'
          
          const endpoint="https://quintus.colosseum.workers.dev/mcp";
          let passes=0;function check(ok,label){if(!ok){console.error("FAIL "+label);process.exitCode=1}else{passes++;console.log("PASS "+label)}}
          async function rpc(method,params={}){const response=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json","mcp-protocol-version":"2026-07-28"},body:JSON.stringify({jsonrpc:"2.0",id:13,method,params})});return {http:response.status,json:await response.json()}}
          const discover=await rpc("server/discover");check(discover.http===200&&discover.json.result?.supportedVersions?.includes("2026-07-28"),"MCP discovery");
          const list=await rpc("tools/list");const names=(list.json.result?.tools||[]).map(t=>t.name);check(names.includes("budget.status"),"budget status advertised");check(!names.includes("workspace.put"),"private workspace mutation hidden");
          const status=await rpc("tools/call",{name:"budget.status",arguments:{}});const b=status.json.result?.structuredContent;
          check(!status.json.result?.isError&&b?.allowed===true,"budget guard healthy and open");
          check(b?.cutoff==="2026-10-31T00:00:00.000Z","pre-November latch cutoff");
          check(b?.semantic?.month_limit===500&&b?.semantic?.day_limit===20,"search hard budget thresholds");
          check(b?.ingestion_estimated_tokens?.month_limit===1500000&&b?.ingestion_estimated_tokens?.day_limit===75000,"ingestion reservation limits");
          check(b?.kv===false,"no KV usage for status");
          const raw=await rpc("tools/call",{name:"workspace.clear",arguments:{workspace:"default",confirm:"CLEAR default"}});
          check(raw.json.result?.isError===true&&raw.json.result?.structuredContent?.error==="owner_authorization_required","public destructive call rejected");
          console.log("FINAL_BUDGET_VERIFICATION "+JSON.stringify({passed:passes,failed:process.exitCode?1:0,budget:b}));
          
          NODE
