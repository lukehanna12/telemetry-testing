name: Generate Quintus dependency lockfile
on:
  push:
    paths:
      - '.github/workflows/quintus-lockfile-once.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the lockfile
        run: |
          test -f package-lock.json
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock Quintus dependencies for reproducible CI"
          git push origin HEAD:main
